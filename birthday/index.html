<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../birthday/style.css">
    </head>
    <body>
        <div id="header">
            <h1>Today is Nick's birthday 🎉</h1>
            <img id="avatar" src="../imagens/me.jpg">
            <h2 id="age">24 years old</h2>
            <h4 id="date">01.11.2022</h4>
        </div>
        <div class="gift-section">
            <h2 class="frase1">Here's how happy i am for you today</h2>
            <h3 class="tip1">(Hover over the gift)</h3>
            <div class="gift-image" id="gift-image-happy"></div>
        </div>
        <div class="gift-section">
            <h2 class="frase1">How people react when you enter the room</h2>
            <div class="gift-image" id="gift-image-hot"></div>
        </div>
        <div class="gift-section">
            <h2 class="frase1">This one's for you, my friend</h2>
            <div class="gift-image" id="gift-image-cheers"></div>
        </div>
        <div class="footer">
            <p>Want to create your own Birthday GIFt site? Take <a href="https://scrimba.com/learn/htmlandcss" target="_blank">this HTML & CSS course.</a></p>
        </div>
    </body>
</html>
